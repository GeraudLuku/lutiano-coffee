name: backend

on:
  pull_request:
    branches: [develop, main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [develop, main]
    paths: ['backend/**', '.github/workflows/backend.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/lutiano-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers starts MariaDB and Elasticsearch itself; Docker is already on the runner.
      - name: Test
        run: ./gradlew test --no-daemon --console=plain

      - name: Build the jar
        run: ./gradlew bootJar --no-daemon --console=plain -x test

      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/lutiano-api/build/reports/tests/
          retention-days: 7