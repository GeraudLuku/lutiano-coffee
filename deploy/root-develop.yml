apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lutiano-develop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GeraudLuku/lutiano-coffee.git
    targetRevision: develop
    path: deploy/envs/develop
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true