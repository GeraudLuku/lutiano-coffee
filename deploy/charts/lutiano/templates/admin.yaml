apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
data:
  {{- toYaml .Values.admin.config | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: {{ .Values.admin.replicas }}
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
      annotations:
        checksum/config: {{ toYaml .Values.admin.config | sha256sum }}
    spec:
      containers:
        - name: admin
          image: "{{ .Values.admin.image }}:{{ .Values.admin.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: admin-config
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 20
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  selector:
    app: admin
  ports:
    - port: 8081
      targetPort: 8081