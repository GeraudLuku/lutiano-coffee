- name: k3s agent
  hosts: k3s_agent
  tasks:
    - name: Read the join token from the server
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: lutiano-1
      register: join_token
      no_log: true

    - name: Create the k3s config folder
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write the k3s agent config
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          server: https://10.0.1.10:6443
          token: {{ join_token.content | b64decode | trim }}
          node-name: {{ inventory_hostname }}
          node-ip: {{ node_ip }}
      no_log: true

    - name: Install the k3s agent
      ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC=agent sh -
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: agent