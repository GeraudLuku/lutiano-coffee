apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: develop-data
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/GeraudLuku/lutiano-coffee.git
    targetRevision: develop
    path: deploy/data/overlays/develop
  destination:
    server: https://kubernetes.default.svc
    namespace: lutiano-develop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true