apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GeraudLuku/lutiano-coffee.git
    targetRevision: main
    path: deploy/envs/production
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd