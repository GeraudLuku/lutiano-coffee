name: lutiano_seller
description: LUTIANO Seller / Operations app (fixed POS baristas, mobile baristas and market sales agents).
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  lutiano_core:
    path: ../../packages/lutiano_core
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  material_ui: ^1.11.1
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
