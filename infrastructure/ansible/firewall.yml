- name: Firewall
  hosts: all
  vars:
    private_cidr: 10.0.0.0/16
  tasks:
    - name: Allow all traffic from the private network
      ansible.builtin.iptables:
        chain: INPUT
        action: insert
        rule_num: "5"
        source: "{{ private_cidr }}"
        jump: ACCEPT
        comment: lutiano-private-network
      notify: Save firewall rules

  handlers:
    - name: Save firewall rules
      ansible.builtin.command: netfilter-persistent save