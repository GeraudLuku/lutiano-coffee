plugins {
  id 'java'
  id 'org.springframework.boot' version '3.4.4'
  id 'io.spring.dependency-management' version '1.1.7'
}

// Newer than Spring Boot's default: older Testcontainers cannot talk to current Docker Desktop.
ext['testcontainers.version'] = '1.21.3'
group = 'com.lutiano'
version = '0.1.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories { mavenCentral() }

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.6'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
  implementation 'org.flywaydb:flyway-mysql'
  implementation 'com.github.librepdf:openpdf:2.0.3'
  implementation 'io.minio:minio:8.5.17'
  implementation 'com.google.firebase:firebase-admin:9.4.3'
  implementation 'com.google.zxing:core:3.5.3'
  implementation 'com.google.zxing:javase:3.5.3'
  runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:mariadb'
  testImplementation 'org.testcontainers:elasticsearch'
}

tasks.named('test') {
  useJUnitPlatform()
  // Current Docker engines reject the old default API version Testcontainers' client sends.
  systemProperty 'api.version', '1.44'
}
